spring.application.name=uasdisprog-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/uasdisprog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=./uploads/images

# JWT Configuration
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm2026
jwt.expiration=86400000

# TCP Server Configuration
tcp.server.host=localhost
tcp.server.port=6002

# TLS untuk koneksi TCP (opsional, default MATI = plaintext).
# Aktifkan via env var agar tidak ke-commit:
#   TCP_TLS_ENABLED=true
#   TCP_TLS_TRUSTSTORE_PATH=<path ke tcp-truststore.p12>
#   TCP_TLS_TRUSTSTORE_PASSWORD=<password truststore>
# Truststore berisi sertifikat server (dibuat via scripts/gen-tls-certs.sh).
# Protokol baris tidak berubah; yang terenkripsi adalah transportnya.
tcp.tls.enabled=false
#tcp.tls.truststore-path=
#tcp.tls.truststore-password=

# WebSocket Configuration
websocket.endpoint=/ws
websocket.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging Configuration
logging.level.root=INFO
logging.level.com.uasdisprog=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
