spring.application.name=uasdisprog-tcp-server

# TCP Server Configuration
tcp.server.port=6002
tcp.server.thread-pool-size=10

# TLS server (opsional, default MATI = plaintext).
# Aktifkan via env: TCP_TLS_ENABLED=true + TCP_TLS_KEYSTORE_PATH/PASSWORD.
# Keystore (PKCS12) berisi private key + sertifikat, dibuat via scripts/gen-tls-certs.sh.
tcp.tls.enabled=false
#tcp.tls.keystore-path=
#tcp.tls.keystore-password=

# Database Configuration (default lokal; untuk DB remote pakai env var
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# agar IP/password tidak ke-commit ke repo)
spring.datasource.url=jdbc:mysql://192.168.74.157:3306/uasdisprog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=uas
spring.datasource.password=Uas12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Configuration
logging.level.root=INFO
logging.level.com.uasdisprog.tcpserver=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
